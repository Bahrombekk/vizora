# Production Nginx — SPA xizmat qiladi va backend'ga proxy qiladi.
# TLS uchun: 443 server bloki + ssl_certificate qo'shing (sertifikat o'rnatilgach).

# Access log'da QUERY STRING YO'Q ($uri, $request emas). /hls, /whep, /ws/stream
# URL'larida `?token=` (har bir HLS segmentida ham), /api/v1 da `?api_key=` keladi —
# standart `combined` format ularni diskka ochiq yozardi (audit 2026-11-03).
# Referer ham yozilmaydi: integrator sahifasi URL'ida token bo'lishi mumkin.
# (Fayl conf.d/ ichida — http kontekstiga include bo'ladi, log_format shu yerda joiz.)
log_format vz_safe '$remote_addr - [$time_local] "$request_method $uri $server_protocol" '
                   '$status $body_bytes_sent "$http_user_agent" $request_time';

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 16m;
    server_tokens off;   # javoblarda nginx versiyasi ko'rinmasin
    access_log /var/log/nginx/access.log vz_safe;
    # error_log "error" darajasida upstream xatolari bilan TO'LIQ so'rov qatorini
    # (`request: "GET /hls/...?token=..."`) yozadi — formatini o'zgartirib bo'lmaydi.
    # `crit`: token diskka tushmaydi; upstream nosozligi baribir access log'da
    # status (502/504) va $uri bilan ko'rinadi.
    error_log /var/log/nginx/error.log crit;

    # Backend manzili HAR SO'ROVDA Docker DNS'dan olinadi (10s kesh). `proxy_pass
    # http://app:8000` ko'rinishida nginx IP'ni faqat ishga tushganda bir marta
    # aniqlaydi: app konteyneri qayta yaratilsa (yangi IP) web eski IP'ga urinib
    # 502 beradi — panelda "Server javob bermayapti", login ishlamaydi
    # (2026-10-07 da `up -d app` dan keyin aynan shunday bo'ldi).
    # URI qismsiz proxy_pass — so'rov yo'li avvalgidek o'zgarmasdan uzatiladi.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $app_upstream app:8000;
    # Video (/ws/stream, /hls, /whep) — alohida `media` jarayoni: ko'p tomoshabinda
    # API'ning event loop'ini bo'g'masin (APP_ROLE, backend/vizora/media/signals.py).
    set $media_upstream media:8000;

    # --- Xavfsizlik sarlavhalari (har javobga, xato javoblarga ham) ---
    # Panel boshqa saytga iframe qilib qo'yilmasin (clickjacking).
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # CSP: skript/stil faqat o'zimizdan (Vite build inline skript ishlatmaydi). Video
    # blob:/mediastream (hls.js, WebRTC, WebCodecs canvas), WS — o'z hostimiz.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob:; media-src 'self' blob: mediastream:; connect-src 'self' ws://$host wss://$host; worker-src 'self' blob:; font-src 'self' data: https://fonts.gstatic.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    # HSTS — TLS host nginx'da tugaydi; brauzer faqat HTTPS orqali kelsa e'tiborga oladi.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # REST API
    location /api/ {
        proxy_pass http://$app_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # HLS oqim proxy (auth backend'da)
    location /hls/ {
        proxy_pass http://$media_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
    }

    # WebRTC (WHEP) signalling proxy — media UDP orqali TO'G'RIDAN MediaMTX ICE
    # portiga boradi (nginx orqali emas), bu yerda faqat SDP almashinuvi.
    location /whep/ {
        proxy_pass http://$media_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
    }

    # WebSocket video (panel pleyeri, devor) — media jarayoni
    location /ws/stream/ {
        proxy_pass http://$media_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }

    # WebSocket (iste'molchi API: /ws/consumer)
    location /ws/ {
        proxy_pass http://$app_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }

    # SPA — boshqa barcha yo'llar index.html ga
    location / {
        try_files $uri $uri/ /index.html;
    }
}
